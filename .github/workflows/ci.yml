name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Версия pnpm берётся из packageManager в package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      # Секретов в CI нет: только ключи локального стенда, которые CLI выдаёт при запуске.
      # Вывод start содержит эти ключи, поэтому он идёт в файл, а ключи маскируются в логах.
      - name: Start local Supabase
        run: |
          if ! supabase start --workdir packages/db -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,mailpit > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            grep -viE 'key|secret|jwt|token' "$RUNNER_TEMP/supabase-start.log" | tail -50
            exit 1
          fi
          supabase status --workdir packages/db -o json 2>/dev/null \
            | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8").replace(/^[^{]*/,""));for(const [k,v] of Object.entries(s))if(/KEY|SECRET|JWT/.test(k)&&v)console.log("::add-mask::"+v)'
          echo "Supabase started"

      # Тесты базы, воркера и API идут после запуска Supabase.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Сквозные тесты: dev-сервер поднимает Playwright, демо-данные и тестового пользователя — global-setup.
      - name: Local env for web (keys of the local stack, not printed)
        run: pnpm env:local
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Проверка дизайна Impeccable на экранах за входом (apps/web/e2e/detect.spec.ts):
      # detect.js отдаёт live-server скилла Impeccable; браузер headless, графическая среда не нужна.
      - name: Impeccable detector on screens
        env:
          DETECT: "1"
          DO_NOT_TRACK: "1"
          IMPECCABLE_NO_TELEMETRY: "1"
        run: |
          IMP="$RUNNER_TEMP/impeccable"
          mkdir -p "$IMP" && (cd "$IMP" && git init -q && npx -y impeccable@4.6.0 install --providers=claude --project --yes --no-hooks > install.log 2>&1)
          (cd apps/web && "$IMP/.claude/skills/impeccable/scripts/impeccable" live-server --background > /dev/null)
          cd apps/web && pnpm exec playwright test e2e/detect.spec.ts

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --workdir packages/db --no-backup > /dev/null 2>&1 || true
